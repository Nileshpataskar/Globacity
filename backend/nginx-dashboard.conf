# Serves the React admin dashboard (admin/dist) on port 80 inside the container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the newest build after `flutter build web`.
    location ~* (index\.html)$ {
        add_header Cache-Control "no-store";
    }
}
