name: globacity

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: globacity
      POSTGRES_USER: globacity
      POSTGRES_PASSWORD: globacity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globacity"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    env_file: .env
    environment:
      DEV_SERVER: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../admin/dist:/usr/share/nginx/html:ro
      - ./nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
